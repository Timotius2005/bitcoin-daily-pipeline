name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - "output/**" # commit hasil harian tidak perlu memicu tes
      - "**/*.md"
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Jalankan tes
        run: pytest -q
